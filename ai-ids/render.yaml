# Render Blueprint — deploys the backend + database.
# Frontend is hosted separately on Vercel.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render Dashboard -> New -> Blueprint -> connect your repo.
#   3. Render reads this file and provisions everything below automatically.
#   4. After the backend deploys, copy its https://...onrender.com URL into
#      frontend/config.js (replace the placeholder), commit, push to redeploy Vercel.

databases:
  - name: ai-ids-db
    plan: free
    region: oregon

services:
  - type: web
    name: ai-ids-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python -m app.ml.train"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ids-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"